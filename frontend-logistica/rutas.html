<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGITRANS · Gestión de Rutas</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- HERO -->
    <header class="hero hero--rutas">
        <div class="hero__overlay">
            <!-- NAVEGACIÓN ENTRE MÓDULOS (barra superior) -->
            <nav class="nav">
                <a href="inicio.html" class="nav__link">Inicio</a>
                <a href="index.html" class="nav__link">Vehículos</a>
                <a href="conductores.html" class="nav__link">Conductores</a>
                <a href="rutas.html" class="nav__link nav__link--activo">Rutas</a>
                <a href="viajes.html" class="nav__link">Viajes</a>
            </nav>

            <div class="hero__brand">
                <span class="hero__logo">L</span>
                <span class="hero__name">LOGITRANS</span>
            </div>
            <h1 class="hero__title">Gestión de Rutas</h1>
            <p class="hero__subtitle">Rutas y programación logística</p>
        </div>
    </header>

    <main class="container">

        <!-- MENSAJES -->
        <div id="mensaje" class="mensaje" hidden></div>

        <!-- ESTADÍSTICAS -->
        <section class="stats">
            <div class="stat stat--total">
                <div class="stat__num" id="statTotal">0</div>
                <div class="stat__label">Total rutas</div>
            </div>
            <div class="stat stat--ok">
                <div class="stat__num" id="statDistanciaMax">0</div>
                <div class="stat__label">Distancia máx (km)</div>
            </div>
            <div class="stat stat--ruta">
                <div class="stat__num" id="statDistanciaMin">0</div>
                <div class="stat__label">Distancia mín (km)</div>
            </div>
            <div class="stat stat--mant">
                <div class="stat__num" id="statCiudades">0</div>
                <div class="stat__label">Ciudades</div>
            </div>
        </section>

        <!-- BARRA DE ACCIONES -->
        <section class="toolbar">
            <div class="toolbar__filters">
                <input type="text" id="filtroCiudad" class="input" placeholder="Buscar por ciudad...">
                <button class="btn btn--ghost" id="btnBuscar">Buscar</button>
            </div>
            <button class="btn btn--primary" id="btnNuevo">+ Nueva ruta</button>
        </section>

        <!-- TABLA -->
        <section class="card-table">
            <table class="tabla">
                <thead>
                    <tr>
                        <th>Origen</th>
                        <th>Destino</th>
                        <th>Distancia</th>
                        <th>Tiempo estimado</th>
                        <th>Observaciones</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaBody">
                    <tr><td colspan="6" class="tabla__empty">Cargando...</td></tr>
                </tbody>
            </table>
        </section>
    </main>

    <!-- MODAL FORMULARIO -->
    <div class="modal" id="modal" hidden>
        <div class="modal__box">
            <h2 class="modal__title" id="modalTitulo">Nueva ruta</h2>
            <form id="formRuta" class="form">
                <input type="hidden" id="rutaId">

                <div class="form__row">
                    <div class="form__group">
                        <label for="ciudad_origen">Ciudad origen *</label>
                        <input type="text" id="ciudad_origen" class="input" required>
                    </div>
                    <div class="form__group">
                        <label for="ciudad_destino">Ciudad destino *</label>
                        <input type="text" id="ciudad_destino" class="input" required>
                    </div>
                </div>

                <div class="form__row">
                    <div class="form__group">
                        <label for="distancia">Distancia (km) *</label>
                        <input type="number" id="distancia" class="input" min="1" step="0.01" required>
                    </div>
                    <div class="form__group">
                        <label for="tiempo_estimado">Tiempo estimado *</label>
                        <input type="text" id="tiempo_estimado" class="input" placeholder="8 horas" required>
                    </div>
                </div>

                <div class="form__group">
                    <label for="observaciones">Observaciones</label>
                    <input type="text" id="observaciones" class="input" placeholder="Opcional">
                </div>

                <div class="form__actions">
                    <button type="button" class="btn btn--ghost" id="btnCancelar">Cancelar</button>
                    <button type="submit" class="btn btn--primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/sesion.js"></script>
    <script src="js/rutas.js"></script>
</body>
</html>
