<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LOGITRANS">
  <defs>
    <linearGradient id="lt-emblem" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
  </defs>
  <!-- Emblema redondeado -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#lt-emblem)"/>
  <!-- Globo / orbita -->
  <path d="M14 32a18 18 0 0 1 36 0" fill="none" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round" opacity=".55"/>
  <ellipse cx="32" cy="26" rx="17" ry="6.5" fill="none" stroke="#bfdbfe" stroke-width="2" opacity=".45"/>
  <!-- Camion estilizado (vista lateral, plano) -->
  <g fill="#ffffff">
    <!-- Caja de carga -->
    <rect x="13" y="30" width="20" height="13" rx="2"/>
    <!-- Cabina -->
    <path d="M33 33h7.2c1 0 1.9.5 2.5 1.3l4.1 5.6c.4.5.6 1.2.6 1.9V43H33V33z"/>
    <!-- Ventana cabina -->
    <path d="M35.4 35.2h4.2c.5 0 1 .25 1.3.7l2.1 2.9c.4.55 0 1.3-.65 1.3H35.4v-4.9z" fill="#1e40af"/>
  </g>
  <!-- Ruedas -->
  <circle cx="20" cy="45" r="3.4" fill="#0b1220"/>
  <circle cx="20" cy="45" r="1.3" fill="#bfdbfe"/>
  <circle cx="41" cy="45" r="3.4" fill="#0b1220"/>
  <circle cx="41" cy="45" r="1.3" fill="#bfdbfe"/>
  <!-- Lineas de velocidad -->
  <path d="M8 36h7M6 40h5" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round" opacity=".8"/>
</svg>
